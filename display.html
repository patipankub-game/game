<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Chaos Engine 70/30 Mode</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body {
      margin: 0; padding: 30px 20px; min-height: 100vh; background: #080811;
      background-image: radial-gradient(circle at 50% 20%, rgba(255, 0, 128, 0.25) 0%, transparent 60%), radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.2) 0%, transparent 50%);
      color: white; text-align: center;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1.logo {
      font-size: 48px; font-weight: 800; margin: 0;
      background: linear-gradient(45deg, #ff007f, #00f2fe);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .room-card {
      background: rgba(22, 22, 35, 0.8); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px;
      padding: 10px 25px; display: inline-block; margin: 15px 0;
    }
    .room-code { font-size: 36px; font-weight: 800; color: #00f2fe; }
    
    .status-box {
      background: rgba(20, 20, 35, 0.9); border: 2px solid #ff007f;
      border-radius: 24px; padding: 30px; margin: 20px 0;
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.3); min-height: 200px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
    }
    .event-title { font-size: 38px; font-weight: 800; color: #00f2fe; }
    .event-desc { font-size: 22px; color: #fff; margin-top: 10px; }

    .players-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px; margin-top: 20px;
    }
    .player-card {
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 0, 128, 0.3);
      border-radius: 16px; padding: 15px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1 class="logo">PARTY CHAOS ENGINE (BALANCED) 🥂</h1>
    <div class="room-card">ROOM CODE: <span class="room-code">8888</span></div>

    <div class="status-box">
      <div id="eventTitle" class="event-title">👀 กำลังส่องวงเหล้า...</div>
      <div id="eventDesc" class="event-desc">ระบบสุ่มทุก 1.5 - 3 นาที (โอกาสรอด 70% / โดนเกม 30%)</div>
    </div>

    <h3 style="margin-top: 30px;">👥 ผู้ร่วมชะตากรรม (<span id="playerCount" style="color: #ff007f;">0</span> คน)</h3>
    <div id="playersGrid" class="players-grid"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://afhsvrsgfuxaeqvjedxf.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmaHN2cnNnZnV4YWVxdmplZHhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTc0NDIsImV4cCI6MjEwMDc5MzQ0Mn0.yIrUTR3EXBgyzqqlxSvsY39mxP3hjzi51HJkExE2okM';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const targetRoom = "8888";

    let playerList = [];
    let roomChannel = _supabase.channel('room_' + targetRoom);
    
    roomChannel
      .on('broadcast', { event: 'game_response' }, payload => {
        let d = payload.payload;
        if(d.action === 'BOMB_EXPLODED') {
          document.getElementById('eventTitle').innerText = "💣 ตู้มมมมม!";
          document.getElementById('eventDesc').innerText = `ระเบิดตู้มใส่ ${d.victim}! จัดไป 1 ช็อต!`;
        }
      })
      .subscribe();

    async function fetchPlayers() {
      const { data } = await _supabase.from('players').select('*').eq('room_code', targetRoom);
      if (data) {
        playerList = data;
        renderPlayers();
      }
    }

    function renderPlayers() {
      document.getElementById('playerCount').innerText = playerList.length;
      const grid = document.getElementById('playersGrid');
      grid.innerHTML = '';
      playerList.forEach(p => {
        grid.innerHTML += `<div class="player-card">😎 <div style="font-weight:600">${p.player_name}</div></div>`;
      });
    }

    fetchPlayers();
    _supabase.channel('public:players')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'players' }, payload => {
        if (payload.new.room_code === targetRoom) fetchPlayers();
      }).subscribe();

    // ----------------------------------------------------
    // ⚙️ CHAOS ENGINE LOOP (สุ่มช่วงเวลา 1.5 - 3 นาที)
    // ----------------------------------------------------
    function startChaosLoop() {
      let nextInterval = Math.floor(Math.random() * (180000 - 90000 + 1)) + 90000; 

      setTimeout(() => {
        triggerRandomEvent();
        startChaosLoop();
      }, nextInterval);
    }

    function triggerRandomEvent() {
      if (playerList.length === 0) return;

      // 🎯 สุ่มดวงก่อน: 1-10 (1-7 คือรอด 70% / 8-10 คือโดนเกม 30%)
      let luckRoll = Math.floor(Math.random() * 10) + 1;

      if (luckRoll <= 7) {
        let safeMessages = [
          "🎉 สวรรค์ทรงโปรด! รอบนี้รอดทุกคน พักตับ 3 นาที!",
          "💧 แจ้งเตือนสุขภาพ: จิบน้ำเปล่ากันคนละกึ๊บด่วน!",
          "🍻 ชนแก้วเบาๆ แบบสันติภาพ ไม่มีใครโดนทำโทษ!",
          "✨ ปลอดภัยไร้ระเบิด! สังสรรค์กันต่อตามอัธยาศัย"
        ];
        let randomMsg = safeMessages[Math.floor(Math.random() * safeMessages.length)];

        document.getElementById('eventTitle').innerText = "🟢 SAFE ZONE!";
        document.getElementById('eventDesc').innerText = randomMsg;

        roomChannel.send({ type: 'broadcast', event: 'chaos_trigger', payload: { type: 'SAFE_ZONE', msg: randomMsg } });
      } 
      else {
        let eventType = Math.floor(Math.random() * 5) + 1; 

        if (eventType === 1) {
          let victim = playerList[Math.floor(Math.random() * playerList.length)];
          document.getElementById('eventTitle').innerText = "🚨 RED FLASH! 🚨";
          document.getElementById('eventDesc').innerText = `สเปกตรัมตกที่: ${victim.player_name} (ยก 1 ช็อต!)`;
          roomChannel.send({ type: 'broadcast', event: 'chaos_trigger', payload: { type: 'RED_FLASH', victimName: victim.player_name } });
        } 
        else if (eventType === 2) {
          document.getElementById('eventTitle').innerText = "⚡ SPEED TAP! ⚡";
          document.getElementById('eventDesc').innerText = "กดปุ่มบนมือถือด่วน! ใครกดช้าสุดเตรียมตัว!";
          roomChannel.send({ type: 'broadcast', event: 'chaos_trigger', payload: { type: 'SPEED_TAP' } });
        } 
        else if (eventType === 3) {
          let holder = playerList[Math.floor(Math.random() * playerList.length)];
          document.getElementById('eventTitle').innerText = "💣 BOMB PASS! 💣";
          document.getElementById('eventDesc').innerText = `ระเบิดเริ่มที่: ${holder.player_name}! รีบส่งต่อด่วน!`;
          roomChannel.send({ type: 'broadcast', event: 'chaos_trigger', payload: { type: 'BOMB_START', holderName: holder.player_name, playerList: playerList.map(p => p.player_name) } });
        } 
        else if (eventType === 4) {
          let words = ["กิน", "แก้ว", "ชน", "มึง", "ช็อต"];
          let randomWord = words[Math.floor(Math.random() * words.length)];
          document.getElementById('eventTitle').innerText = "🤐 SILENT MODE (1 นาที)";
          document.getElementById('eventDesc').innerText = `กฎเหล็ก: ห้ามใครพูดคำว่า "${randomWord}" เด็ดขาด!`;
          roomChannel.send({ type: 'broadcast', event: 'chaos_trigger', payload: { type: 'SILENT_RULE', word: randomWord } });
        } 
        else if (eventType === 5) {
          let questions = ["ใครทรงน่าจะกลับบ้านคนแรก?", "ใครคออ่อนที่สุดในโต๊ะ?", "ใครเจ้าชู้ที่สุดในวง?"];
          let q = questions[Math.floor(Math.random() * questions.length)];
          document.getElementById('eventTitle').innerText = "👉 VOTE TIME!";
          document.getElementById('eventDesc').innerText = q;
          roomChannel.send({ type: 'broadcast', event: 'chaos_trigger', payload: { type: 'VOTE_GAME', question: q, playerList: playerList.map(p => p.player_name) } });
        }
      }
    }

    startChaosLoop();
  </script>
</body>
</html>
