<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Chaos Engine - Player</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body {
      margin: 0; padding: 20px; min-height: 100vh; background: #080811;
      color: white; text-align: center; display: flex; flex-direction: column; justify-content: center;
      transition: background 0.2s;
    }
    body.warning-flash {
      animation: flashBg 0.4s infinite alternate;
    }
    @keyframes flashBg {
      from { background: #080811; }
      to { background: #880000; }
    }

    .card {
      background: rgba(22, 22, 35, 0.9); border: 1px solid rgba(255, 0, 128, 0.3);
      border-radius: 20px; padding: 25px; box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }
    input {
      width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px;
      border: 1px solid #ff007f; background: #161623; color: white;
      font-size: 18px; text-align: center; outline: none;
    }
    button {
      width: 100%; padding: 14px; margin-top: 10px; border-radius: 10px; border: none;
      background: linear-gradient(45deg, #ff007f, #00f2fe); color: white;
      font-size: 18px; font-weight: bold; cursor: pointer;
    }
    .game-screen { display: none; }
    .status-text { font-size: 24px; font-weight: bold; color: #00f2fe; margin-bottom: 15px; }
    .countdown-num { font-size: 80px; font-weight: 800; color: #ff0055; text-shadow: 0 0 20px #ff0055; margin: 10px 0; }
    .btn-leave { background: rgba(255,0,85,0.2); border: 1px solid #ff0055; color: #ff4d4d; font-size: 14px; padding: 8px; margin-top: 20px; }
  </style>
</head>
<body>

  <div class="card">
    <!-- หน้าจอ LOGIN -->
    <div id="loginScreen">
      <h2 style="color:#ff007f; margin-top:0;">เข้าร่วมวงปาร์ตี้ 🍻</h2>
      <input type="number" id="roomInput" placeholder="กรอก Room Code (4 หลัก)">
      <input type="text" id="nameInput" placeholder="พิมพ์ชื่อของคุณ">
      <button onclick="joinGame()">เข้าวงด่วน!</button>
    </div>

    <!-- หน้าจอผู้เล่นขณะอยู่ในเกม -->
    <div id="gameScreen" class="game-screen">
      <div id="playerNameDisplay" style="color: #aaa; font-size: 14px;">ผู้เล่น: -</div>
      <div id="roomDisplay" style="color: #00f2fe; font-size: 16px; margin-bottom: 20px;">ห้อง: -</div>
      <div id="statusText" class="status-text">👀 รอคำสั่งจากจอกลาง...</div>
      <div id="actionArea"></div>
      
      <button class="btn-leave" onclick="leaveGame()">🚪 ออกจากห้องนี้</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://afhsvrsgfuxaeqvjedxf.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmaHN2cnNnZnV4YWVxdmplZHhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTc0NDIsImV4cCI6MjE0MDc5MzQ0Mn0.yIrUTR3EXBgyzqqlxSvsY39mxP3hjzi51HJkExE2okM';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentRoom = "";
    let currentPlayer = "";
    let roomChannel = null;

    async function joinGame() {
      const room = document.getElementById('roomInput').value.trim();
      const name = document.getElementById('nameInput').value.trim();

      if (!room || !name) {
        alert("กรุณากรอก Room Code และชื่อให้ครบถ้วนครับ!");
        return;
      }

      currentRoom = room;
      currentPlayer = name;

      // บันทึกลง Supabase ทันที
      const { data, error } = await _supabase
        .from('players')
        .insert([{ room_code: room, player_name: name }]);

      if (error) {
        console.error("Supabase Error:", error);
        alert("เกิดข้อผิดพลาดในการเข้าห้อง: " + error.message);
        return;
      }

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'block';
      document.getElementById('playerNameDisplay').innerText = `ผู้เล่น: ${name}`;
      document.getElementById('roomDisplay').innerText = `ห้อง: ${room}`;

      listenToRoom();
    }

    function listenToRoom() {
      if (roomChannel) _supabase.removeChannel(roomChannel);

      roomChannel = _supabase.channel('room_' + currentRoom);
      
      roomChannel
        .on('broadcast', { event: 'chaos_trigger' }, payload => {
          let data = payload.payload;
          let status = document.getElementById('statusText');
          let area = document.getElementById('actionArea');

          if (data.type === 'COUNTDOWN_START') {
            document.body.classList.add('warning-flash');
            if (navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 400]);
            
            status.innerText = "🚨 WARNING! เตรียมตัว!";
            let count = data.seconds;
            area.innerHTML = `<div class="countdown-num">${count}</div>`;

            let cd = setInterval(() => {
              count--;
              if (count > 0) {
                area.innerHTML = `<div class="countdown-num">${count}</div>`;
              } else {
                clearInterval(cd);
                document.body.classList.remove('warning-flash');
              }
            }, 1000);
          }
          else if (data.type === 'SAFE_ZONE') {
            document.body.classList.remove('warning-flash');
            status.innerText = "🟢 SAFE ZONE!";
            area.innerHTML = `<p style="color:#fff">${data.msg}</p>`;
          } 
          else if (data.type === 'RED_FLASH') {
            document.body.classList.remove('warning-flash');
            status.innerText = "🚨 RED FLASH! 🚨";
            if (data.victimName === currentPlayer) {
              if (navigator.vibrate) navigator.vibrate([500, 200, 500]);
              area.innerHTML = `<h1 style="color:#ff0055; font-size:36px;">โดนเต็มๆ!<br>จัดไป 1 ช็อต! 🍺</h1>`;
            } else {
              area.innerHTML = `<p>รอดตัวไป! คนโดนคือ: <b style="color:#00f2fe">${data.victimName}</b></p>`;
            }
          }
          else if (data.type === 'SILENT_RULE') {
            document.body.classList.remove('warning-flash');
            status.innerText = "🤐 SILENT MODE";
            area.innerHTML = `<p>ห้ามพูดคำว่า: <b style="color:#ff007f; font-size:24px;">"${data.word}"</b></p>`;
          }
        })
        .subscribe();
    }

    function leaveGame() {
      window.location.reload();
    }
  </script>
</body>
</html>
