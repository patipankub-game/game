<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Party Chaos Engine (With Countdown & Sound)</title>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; font-family: 'Kanit', sans-serif; }
    body {
      margin: 0; padding: 30px 20px; min-height: 100vh; background: #080811;
      background-image: radial-gradient(circle at 50% 20%, rgba(255, 0, 128, 0.25) 0%, transparent 60%), radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.2) 0%, transparent 50%);
      color: white; text-align: center;
    }
    .container { max-width: 900px; margin: 0 auto; }
    h1.logo {
      font-size: 48px; font-weight: 800; margin: 0;
      background: linear-gradient(45deg, #ff007f, #00f2fe);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .room-card {
      background: rgba(22, 22, 35, 0.8); backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 20px;
      padding: 10px 25px; display: inline-block; margin: 15px 0;
    }
    .room-code { font-size: 36px; font-weight: 800; color: #00f2fe; letter-spacing: 2px; }
    
    .status-box {
      background: rgba(20, 20, 35, 0.9); border: 2px solid #ff007f;
      border-radius: 24px; padding: 30px; margin: 20px 0;
      box-shadow: 0 0 30px rgba(255, 0, 127, 0.3); min-height: 220px;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      transition: all 0.3s ease;
    }
    .status-box.warning-mode {
      border-color: #ff0000;
      animation: blinkBg 0.5s infinite alternate;
    }
    @keyframes blinkBg {
      from { box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); }
      to { box-shadow: 0 0 60px rgba(255, 0, 0, 0.9); background: rgba(50, 10, 20, 0.95); }
    }

    .event-title { font-size: 38px; font-weight: 800; color: #00f2fe; }
    .event-desc { font-size: 22px; color: #fff; margin-top: 10px; }

    /* 💓 Heartbeat: จุดกระพริบตลอดเวลาตอนอยู่โหมดรอ เพื่อยืนยันว่าระบบยังทำงานอยู่ ไม่ได้ค้าง */
    .heartbeat-dot {
      display: inline-block; width: 10px; height: 10px; border-radius: 50%;
      background: #00ff88; margin-right: 8px; vertical-align: middle;
      animation: pulseDot 1.2s ease-in-out infinite;
      box-shadow: 0 0 8px #00ff88;
    }
    @keyframes pulseDot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.3; transform: scale(0.7); }
    }
    .live-label { font-size: 14px; color: #00ff88; letter-spacing: 1px; margin-bottom: 8px; }
    .countdown-num { font-size: 90px; font-weight: 800; color: #ff0055; text-shadow: 0 0 20px #ff0055; margin: 0; }

    .players-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px; margin-top: 20px;
    }
    .player-card {
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 0, 128, 0.3);
      border-radius: 16px; padding: 15px; animation: popIn 0.3s ease-out;
    }
    @keyframes popIn {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .ai-badge {
      background: linear-gradient(45deg, #7928ca, #ff007f);
      font-size: 14px; padding: 4px 12px; border-radius: 10px; margin-left: 8px; vertical-align: middle;
    }
    .btn-action {
      background: rgba(255, 0, 85, 0.2); border: 1px solid #ff0055;
      color: #ff4d4d; padding: 10px 20px; border-radius: 14px;
      font-size: 16px; cursor: pointer; margin-top: 25px; transition: 0.2s; font-weight: 600;
    }
    .btn-audio {
      background: #00f2fe; color: #000; font-weight: bold; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <div class="container">
    <button id="enableAudioBtn" class="btn-audio" onclick="enableAudio()">🔊 คลิก 1 ครั้งเพื่อเปิดเสียงเตือนปาร์ตี้</button>
    
    <h1 class="logo">PARTY CHAOS ENGINE <span class="ai-badge">AI ACTIVE 🤖</span></h1>
    <div class="room-card">ROOM CODE: <span id="displayRoomCode" class="room-code">----</span></div>

    <div id="statusBox" class="status-box">
      <div id="liveIndicator" class="live-label"><span class="heartbeat-dot"></span>LIVE - ระบบทำงานปกติ</div>
      <div id="eventTitle" class="event-title">👀 กำลังส่องวงเหล้า...</div>
      <div id="eventDesc" class="event-desc">ระบบสุ่มทุก 1.5 - 3 นาที (AI สุ่มคิดเกมสดตลอดเวลา)</div>
    </div>

    <h3 style="margin-top: 30px;">👥 ผู้ร่วมชะตากรรม (<span id="playerCount" style="color: #ff007f;">0</span> คน)</h3>
    <div id="playersGrid" class="players-grid"></div>

    <button class="btn-action" onclick="finishAndNewRoom()">🚪 จบวงนี้ & สุ่มสร้างห้องใหม่ (ลบผู้เล่นเก่า)</button>
  </div>

  <audio id="sirenSound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script>
    const SUPABASE_URL = 'https://afhsvrsgfuxaeqvjedxf.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFmaHN2cnNnZnV4YWVxdmplZHhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyMTc0NDIsImV4cCI6MjEwMDc5MzQ0Mn0.yIrUTR3EXBgyzqqlxSvsY39mxP3hjzi51HJkExE2okM';
    
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
      auth: { persistSession: false }
    });

    const GEMINI_API_KEY = "วาง_GEMINI_API_KEY_ของคุณตรงนี้";

    let targetRoom = localStorage.getItem('party_display_room');
    if (!targetRoom) {
      targetRoom = Math.floor(1000 + Math.random() * 9000).toString();
      localStorage.setItem('party_display_room', targetRoom);
    }
    document.getElementById('displayRoomCode').innerText = targetRoom;

    let playerList = [];
    let roomChannel = _supabase.channel('room_' + targetRoom);
    let audioAllowed = false;
    let idleResetTimer = null; // ตัวจับเวลาเด้งกลับหน้ารอ หลังโชว์คำสั่ง/ผลลัพธ์ครบเวลา

    // 🔁 เด้งกลับไปหน้า "กำลังส่อง..." (โหมดรอ) และโชว์ heartbeat ให้เห็นว่าระบบยังทำงานอยู่
    function resetToIdle() {
      document.getElementById('statusBox').classList.remove('warning-mode');
      document.getElementById('eventTitle').innerText = "👀 กำลังส่องวงเหล้า...";
      document.getElementById('eventDesc').innerText = "ระบบสุ่มทุก 1.5 - 3 นาที (AI สุ่มคิดเกมสดตลอดเวลา)";
      document.getElementById('liveIndicator').style.display = 'block';
    }

    function scheduleIdleReset(ms = 10000) {
      if (idleResetTimer) clearTimeout(idleResetTimer);
      idleResetTimer = setTimeout(resetToIdle, ms);
    }

    function enableAudio() {
      let audio = document.getElementById('sirenSound');
      audio.play().then(() => {
        audio.pause();
        audio.currentTime = 0;
        audioAllowed = true;
        document.getElementById('enableAudioBtn').style.display = 'none';
      }).catch(e => console.log("Audio play error", e));
    }

    function playSiren() {
      if (audioAllowed) {
        let audio = document.getElementById('sirenSound');
        audio.currentTime = 0;
        audio.play();
      }
    }

    async function fetchPlayers() {
      const { data, error } = await _supabase
        .from('players')
        .select('*')
        .eq('room_code', targetRoom);
      
      if (data) {
        playerList = data;
        renderPlayers();
      }
    }

    function renderPlayers() {
      document.getElementById('playerCount').innerText = playerList.length;
      const grid = document.getElementById('playersGrid');
      grid.innerHTML = '';
      playerList.forEach(p => {
        grid.innerHTML += `<div class="player-card">😎 <div style="font-weight:600">${p.player_name}</div></div>`;
      });
    }

    function initRealtime() {
      _supabase
        .channel('realtime_players_' + targetRoom)
        .on(
          'postgres_changes',
          { event: '*', schema: 'public', table: 'players', filter: `room_code=eq.${targetRoom}` },
          (payload) => {
            fetchPlayers();
          }
        )
        .subscribe();
    }

    async function finishAndNewRoom() {
      if (confirm("ต้องการปิดวงนี้ และสุ่มสร้างห้องใหม่ใช่ไหม? (ผู้เล่นเก่าจะต้องเข้าห้องใหม่)")) {
        await _supabase.from('players').delete().eq('room_code', targetRoom);
        localStorage.removeItem('party_display_room');
        window.location.reload(); 
      }
    }

    fetchPlayers();
    initRealtime();

    async function askGemini(promptText, fallbackAnswer) {
      if (!GEMINI_API_KEY || GEMINI_API_KEY.includes("วาง_GEMINI")) {
        return fallbackAnswer;
      }
      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ contents: [{ parts: [{ text: promptText }] }] })
        });
        const data = await response.json();
        return data.candidates[0].content.parts[0].text.trim();
      } catch (err) {
        return fallbackAnswer;
      }
    }

    function startChaosLoop() {
      let nextInterval = Math.floor(Math.random() * (180000 - 90000 + 1)) + 90000; 

      setTimeout(() => {
        triggerRandomEvent();
        startChaosLoop();
      }, nextInterval);
    }

    async function triggerRandomEvent() {
      if (playerList.length === 0) return;

      let luckRoll = Math.floor(Math.random() * 10) + 1;

      if (luckRoll <= 7) {
        let safeMessages = [
          "🎉 สวรรค์ทรงโปรด! รอบนี้รอดทุกคน พักตับ 3 นาที!",
          "💧 แจ้งเตือนสุขภาพ: จิบน้ำเปล่ากันคนละกึ๊บด่วน!",
          "🍻 ชนแก้วเบาๆ แบบสันติภาพ ไม่มีใครโดนทำโทษ!",
          "✨ ปลอดภัยไร้ระเบิด! สังสรรค์กันต่อตามอัธยาศัย"
        ];
        let randomMsg = safeMessages[Math.floor(Math.random() * safeMessages.length)];

        document.getElementById('statusBox').classList.remove('warning-mode');
        document.getElementById('liveIndicator').style.display = 'none';
        document.getElementById('eventTitle').innerText = "🟢 SAFE ZONE!";
        document.getElementById('eventDesc').innerText = randomMsg;

        roomChannel.send({ type: 'broadcast', event: 'chaos_trigger', payload: { type: 'SAFE_ZONE', msg: randomMsg } });
        scheduleIdleReset(); // โชว์ข้อความ 10 วิ แล้วเด้งกลับหน้ารอ
      } 
      else {
        if (idleResetTimer) clearTimeout(idleResetTimer); // ระหว่างนับถอยหลัง/โชว์ผล ยังไม่ต้องเด้งกลับ
        playSiren();
        let statusBox = document.getElementById('statusBox');
        statusBox.classList.add('warning-mode');
        document.getElementById('liveIndicator').style.display = 'none';

        document.getElementById('eventTitle').innerText = "🚨 WARNING! คำสั่งฉุกเฉิน! 🚨";
        
        let count = 3;
        document.getElementById('eventDesc').innerHTML = `<div class="countdown-num">${count}</div>`;
        
        roomChannel.send({ type: 'broadcast', event: 'chaos_trigger', payload: { type: 'COUNTDOWN_START', seconds: count } });

        let countdownTimer = setInterval(async () => {
          count--;
          if (count > 0) {
            document.getElementById('eventDesc').innerHTML = `<div class="countdown-num">${count}</div>`;
          } else {
            clearInterval(countdownTimer);
            statusBox.classList.remove('warning-mode');
            executeEvent();
          }
        }, 1000);
      }
    }

    async function executeEvent() {
      let eventType = Math.floor(Math.random() * 5) + 1; 

      if (eventType === 1) {
        let victim = playerList[Math.floor(Math.random() * playerList.length)];
        document.getElementById('eventTitle').innerText = "🚨 RED FLASH! 🚨";
        document.getElementById('eventDesc').innerText = `สเปกตรัมตกที่: ${victim.player_name} (ยก 1 ช็อต!)`;
        roomChannel.send({ type: 'broadcast', event: 'chaos_trigger', payload: { type: 'RED_FLASH', victimName: victim.player_name } });
      } 
      else if (eventType === 2) {
        document.getElementById('eventTitle').innerText = "⚡ SPEED TAP! ⚡";
        document.getElementById('eventDesc').innerText = "กดปุ่มบนมือถือด่วน! ใครกดช้าสุดเตรียมตัว!";
        roomChannel.send({ type: 'broadcast', event: 'chaos_trigger', payload: { type: 'SPEED_TAP' } });
      } 
      else if (eventType === 3) {
        let holder = playerList[Math.floor(Math.random() * playerList.length)];
        document.getElementById('eventTitle').innerText = "💣 BOMB PASS! 💣";
        document.getElementById('eventDesc').innerText = `ระเบิดเริ่มที่: ${holder.player_name}! รีบส่งต่อด่วน!`;
        roomChannel.send({ type: 'broadcast', event: 'chaos_trigger', payload: { type: 'BOMB_START', holderName: holder.player_name, playerList: playerList.map(p => p.player_name) } });
      } 
      else if (eventType === 4) {
        let aiPrompt = "ขอคำห้ามพูด 1 คำที่คนในวงเหล้าชอบพูดบ่อยๆ ขอแบบคำเดียวสั้นๆ ภาษาไทย เช่น 'กิน', 'แก้ว', 'มึง', 'ชน' ตอบเฉพาะตัวคำนั้นเท่านั้น";
        let randomWord = await askGemini(aiPrompt, "ชน");

        document.getElementById('eventTitle').innerText = "🤐 SILENT MODE (1 นาที)";
        document.getElementById('eventDesc').innerText = `กฎเหล็กจาก AI: ห้ามใครพูดคำว่า "${randomWord}" เด็ดขาด!`;
        roomChannel.send({ type: 'broadcast', event: 'chaos_trigger', payload: { type: 'SILENT_RULE', word: randomWord } });
      } 
      else if (eventType === 5) {
        let aiPrompt = "ขอคำถามโหวตปั่นๆ กวนๆ ฮาๆ ในวงเหล้าเพื่อนสนิท 1 ข้อ เช่น 'ใครทรงน่าจะกลับบ้านคนแรก', 'ใครชอบทักหาแฟนเก่าตอนเมา' ตอบเฉพาะคำถามภาษาไทยสั้นๆ ไม่ต้องมีอารัมภบท";
        let q = await askGemini(aiPrompt, "ใครทรงน่าจะกลับบ้านคนแรก?");

        document.getElementById('eventTitle').innerText = "👉 VOTE TIME!";
        document.getElementById('eventDesc').innerText = "🤖 คำถามจาก AI: " + q;
        roomChannel.send({ type: 'broadcast', event: 'chaos_trigger', payload: { type: 'VOTE_GAME', question: q, playerList: playerList.map(p => p.player_name) } });
      }

      scheduleIdleReset(); // โชว์คำสั่ง/ผลลัพธ์ 10 วิ แล้วเด้งกลับหน้า "กำลังส่อง..." อัตโนมัติ
    }

    startChaosLoop();
  </script>
</body>
</html>
